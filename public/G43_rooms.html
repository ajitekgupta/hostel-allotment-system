<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Management | LNMIIT</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <script src="js/navbar.js"></script>

    <div class="container">
        <div class="header">
            <h1>Room Management</h1>
            <p class="subtitle">Manage campus hostel rooms and base rents.</p>
        </div>

        <div class="grid">
            <div class="card">
                <h3>Add New Room</h3>
                <div style="margin-top: 15px;">
                    <label style="display:block; margin-bottom:5px;">Room Number (e.g., BH4-A101)</label>
                    <input type="text" id="roomNumber" class="student-input" style="width: 100%; padding: 10px; margin-bottom: 15px;" required>

                    <label style="display:block; margin-bottom:5px;">Room Type</label>
                    <select id="roomType" class="student-input" style="width: 100%; padding: 10px; margin-bottom: 15px;">
                        <option value="Single">Single</option>
                        <option value="Double">Double</option>
                        <option value="Triple">Triple</option>
                    </select>

                    <label style="display:block; margin-bottom:5px;">Base Rent (₹)</label>
                    <input type="number" id="baseRent" class="student-input" style="width: 100%; padding: 10px; margin-bottom: 15px;" required>

                    <button class="btn btn-primary" style="width: 100%;" onclick="saveRoom()">Save Room</button>
                </div>
            </div>

            <div class="card">
                <h3>Current Rooms</h3>
                <div id="roomList" style="margin-top: 15px;">
                    <p>Loading rooms...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/G43_rooms.js"></script>
</body>
</html>
